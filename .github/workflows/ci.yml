name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: test-token
      OWNER_TELEGRAM_ID: "1"
      ANTHROPIC_API_KEY: test-key
      CLAUDE_MODEL: claude-haiku-4-5
      BRIEF_TIME: "08:00"
      LLM_PROVIDER: claude
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
